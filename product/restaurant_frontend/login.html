<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | System Access</title>
  
  <style>
    /* Reset and Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    :root {
      --orange: #DEAA79;
      --yellow: #FFE6A9;
      --sage: #B1C29E;
      --teal: #659287;
      --orange-rgb: 222, 170, 121;
      --yellow-rgb: 255, 230, 169;
      --sage-rgb: 177, 194, 158;
      --teal-rgb: 101, 146, 135;
      --dark-teal: #4A7668;
      --light-bg: #F8F9FA;
      --border-color: #E0E0E0;
      --text-dark: #333333;
      --text-light: #666666;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.16);
    }
    
    body {
      background: linear-gradient(135deg, var(--light-bg) 0%, #FFFFFF 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }
    
    /* Main Container */
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    
    /* Login Card */
    .login-card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    
    /* Header */
    .login-header {
      background: linear-gradient(135deg, var(--teal), var(--dark-teal));
      color: white;
      padding: 32px 40px;
      text-align: center;
    }
    
    .logo {
      font-size: 32px;
      margin-bottom: 12px;
      display: inline-block;
    }
    
    .login-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .login-subtitle {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 400;
    }
    
    /* Form Area */
    .login-form {
      padding: 40px;
    }
    
    /* Form Groups */
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-label {
      display: block;
      color: var(--text-dark);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.2s;
      background: white;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(var(--teal-rgb), 0.1);
    }
    
    .form-input.error {
      border-color: #DC2626;
      background: #FEF2F2;
    }
    
    /* Password Wrapper */
    .password-wrapper {
      position: relative;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 4px;
      font-size: 18px;
    }
    
    .toggle-password:hover {
      color: var(--teal);
    }
    
    /* Error Message */
    .error-message {
      color: #DC2626;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }
    
    /* Captcha Section */
    .captcha-section {
      background: var(--light-bg);
      border-radius: 8px;
      padding: 20px;
      margin: 30px 0;
      border: 1px solid var(--border-color);
    }
    
    .captcha-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .captcha-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
    }
    
    .refresh-captcha {
      background: var(--sage);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    
    .refresh-captcha:hover:not(:disabled) {
      background: var(--teal);
    }
    
    .refresh-captcha:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .captcha-image-container {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .captcha-loader {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(var(--teal-rgb), 0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #captchaImage {
      max-width: 100%;
      height: auto;
    }
    
    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--teal), var(--dark-teal));
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--dark-teal), var(--teal));
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    
    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }
    
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .btn-loader {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }
    
    /* Status Message */
    .status-message {
      padding: 14px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    
    .status-success {
      background: #DCFCE7;
      color: #166534;
      border: 1px solid #BBF7D0;
    }
    
    .status-error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }
    
    .status-warning {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FDE68A;
    }
    
    /* Footer */
    .login-footer {
      text-align: center;
      padding: 20px 40px;
      border-top: 1px solid var(--border-color);
      background: var(--light-bg);
      font-size: 13px;
      color: var(--text-light);
    }
    
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: white;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      margin-top: 10px;
    }
    
    /* Responsive */
    @media (max-width: 480px) {
      .login-header {
        padding: 24px 20px;
      }
      
      .login-form {
        padding: 30px 20px;
      }
      
      .login-footer {
        padding: 20px;
      }
    }
    
    /* Hidden Elements */
    .hidden {
      display: none !important;
    }
    
    /* Focus Styles */
    .form-input:focus,
    .refresh-captcha:focus,
    .submit-btn:focus,
    .toggle-password:focus {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <div class="logo">🔐</div>
        <h1 class="login-title">System Login</h1>
        <p class="login-subtitle">Secure access to your account</p>
      </div>
      
      <!-- Form -->
      <form id="loginForm" class="login-form" novalidate>
        <!-- Status Message -->
        <div id="statusMessage" class="status-message"></div>
        
        <!-- Username -->
        <div class="form-group">
          <label for="username" class="form-label">
            Username
          </label>
          <input 
            type="text" 
            id="username" 
            class="form-input"
            placeholder="Enter your username"
            autocomplete="username"
            required
            autocapitalize="none"
          >
          <div id="usernameError" class="error-message"></div>
        </div>
        
        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">
            Password
          </label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button 
              type="button" 
              class="toggle-password"
              id="togglePassword"
              aria-label="Show password"
            >
              👁️
            </button>
          </div>
          <div id="passwordError" class="error-message"></div>
        </div>
        
        <!-- CAPTCHA -->
        <div class="captcha-section">
          <div class="captcha-header">
            <div class="captcha-title">Security Verification</div>
            <button 
              type="button" 
              class="refresh-captcha"
              id="refreshCaptcha"
            >
              <span>↻</span>
              <span>Refresh</span>
            </button>
          </div>
          
          <div class="captcha-image-container">
            <div class="captcha-loader" id="captchaLoader"></div>
            <img 
              id="captchaImage" 
              alt="Security captcha"
              crossorigin="anonymous"
            >
          </div>
          
          <input 
            type="hidden" 
            id="captchaKey"
            value=""
          >
          
          <input 
            type="text" 
            id="captchaValue" 
            class="form-input"
            placeholder="Enter the characters above"
            required
            autocomplete="off"
            autocapitalize="off"
          >
          <div id="captchaError" class="error-message"></div>
        </div>
        
        <!-- Submit Button -->
        <button 
          type="submit" 
          class="submit-btn"
          id="submitBtn"
        >
          <span id="btnText">Sign In</span>
          <div class="btn-loader" id="btnLoader"></div>
          <span id="btnIcon">→</span>
        </button>
      </form>
      
      <!-- Footer -->
      <div class="login-footer">
        <div>© 2024 System Access. All rights reserved.</div>
        <div class="security-badge">
          <span>🔒</span>
          <span>Secure Connection</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============ STATE MANAGEMENT ============
    const state = {
      isSubmitting: false,
      isCaptchaLoading: false,
      loginAttempts: 0,
      maxAttempts: 5,
      captchaCooldown: false
    };
    
    // ============ DOM ELEMENTS ============
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const captchaValueInput = document.getElementById('captchaValue');
    const captchaImage = document.getElementById('captchaImage');
    const captchaKeyInput = document.getElementById('captchaKey');
    const captchaLoader = document.getElementById('captchaLoader');
    const refreshCaptchaBtn = document.getElementById('refreshCaptcha');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const btnIcon = document.getElementById('btnIcon');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const statusMessage = document.getElementById('statusMessage');
    
    // ============ UTILITY FUNCTIONS ============
    function showStatus(message, type = 'error') {
      statusMessage.textContent = message;
      statusMessage.className = `status-message status-${type}`;
      statusMessage.style.display = 'block';
      
      if (type === 'success') {
        setTimeout(() => {
          statusMessage.style.display = 'none';
        }, 3000);
      }
    }
    
    function hideStatus() {
      statusMessage.style.display = 'none';
    }
    
    function showError(fieldId, message) {
      const field = document.getElementById(fieldId);
      const errorElement = document.getElementById(`${fieldId}Error`);
      
      if (field) field.classList.add('error');
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.style.display = 'block';
      }
    }
    
    function clearError(fieldId) {
      const field = document.getElementById(fieldId);
      const errorElement = document.getElementById(`${fieldId}Error`);
      
      if (field) field.classList.remove('error');
      if (errorElement) errorElement.style.display = 'none';
    }
    
    function validateForm() {
      let isValid = true;
      
      clearError('username');
      clearError('password');
      clearError('captchaValue');
      hideStatus();
      
      // Username validation
      if (!usernameInput.value.trim()) {
        showError('username', 'Username is required');
        isValid = false;
      }
      
      // Password validation
      if (!passwordInput.value) {
        showError('password', 'Password is required');
        isValid = false;
      }
      
      // Captcha validation
      if (!captchaValueInput.value.trim()) {
        showError('captchaValue', 'Captcha is required');
        isValid = false;
      }
      
      return isValid;
    }
    
    function setLoading(isLoading) {
      state.isSubmitting = isLoading;
      submitBtn.disabled = isLoading;
      
      if (isLoading) {
        btnText.style.display = 'none';
        btnLoader.style.display = 'block';
        btnIcon.style.display = 'none';
      } else {
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
        btnIcon.style.display = 'inline-block';
      }
    }
    
    function setCaptchaLoading(isLoading) {
      state.isCaptchaLoading = isLoading;
      refreshCaptchaBtn.disabled = isLoading;
      
      if (isLoading) {
        captchaLoader.style.display = 'block';
        refreshCaptchaBtn.innerHTML = '<span>⏳</span><span>Loading...</span>';
      } else {
        captchaLoader.style.display = 'none';
        refreshCaptchaBtn.innerHTML = '<span>↻</span><span>Refresh</span>';
      }
    }
    
    // ============ CAPTCHA HANDLING ============
    async function loadCaptcha() {
      if (state.isCaptchaLoading || state.captchaCooldown) return;
      
      state.isCaptchaLoading = true;
      setCaptchaLoading(true);
      
      try {
        const response = await fetch('/api/captcha/', {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
            'Cache-Control': 'no-cache'
          }
        });
        
        if (!response.ok) {
          throw new Error('Failed to load captcha');
        }
        
        const data = await response.json();
        
        if (data.captcha_image && data.captcha_key) {
          captchaImage.src = data.captcha_image;
          captchaKeyInput.value = data.captcha_key;
          captchaValueInput.value = '';
          clearError('captchaValue');
        }
        
      } catch (error) {
        console.error('Captcha error:', error);
        showStatus('Failed to load security image', 'error');
      } finally {
        state.isCaptchaLoading = false;
        setCaptchaLoading(false);
        
        // Cooldown to prevent rapid refreshes
        state.captchaCooldown = true;
        setTimeout(() => {
          state.captchaCooldown = false;
        }, 1000);
      }
    }
    
    // ============ LOGIN HANDLING ============
    async function handleLogin(event) {
      event.preventDefault();
      
      if (state.isSubmitting) {
        showStatus('Please wait...', 'warning');
        return;
      }
      
      if (state.loginAttempts >= state.maxAttempts) {
        showStatus('Too many attempts. Please try again later.', 'error');
        return;
      }
      
      if (!validateForm()) {
        state.loginAttempts++;
        return;
      }
      
      setLoading(true);
      hideStatus();
      
      const loginData = {
        username: usernameInput.value.trim(),
        password: passwordInput.value,
        captcha_key: captchaKeyInput.value,
        captcha_value: captchaValueInput.value.trim()
      };
      
      try {
        const response = await fetch('/api/auth/login/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(loginData)
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Store tokens
          if (data.access) localStorage.setItem('access', data.access);
          if (data.refresh) localStorage.setItem('refresh', data.refresh);
          
          showStatus('Login successful!', 'success');
          state.loginAttempts = 0;
          
          // Redirect
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
          
        } else {
          handleLoginError(response.status, data);
        }
        
      } catch (error) {
        console.error('Login error:', error);
        showStatus('Network error. Please try again.', 'error');
        state.loginAttempts++;
        
        // Reload captcha on network error
        setTimeout(loadCaptcha, 1000);
      } finally {
        setLoading(false);
      }
    }
    
    function handleLoginError(status, data) {
      state.loginAttempts++;
      
      if (status === 400) {
        if (data.captcha_error) {
          showStatus('Invalid captcha. Please try again.', 'error');
          showError('captchaValue', data.captcha_error);
          loadCaptcha();
        } else if (data.non_field_errors) {
          showStatus(data.non_field_errors[0], 'error');
        } else {
          showStatus('Invalid credentials', 'error');
        }
      } else if (status === 401) {
        showStatus('Authentication failed', 'error');
      } else if (status === 429) {
        showStatus('Too many attempts. Please wait.', 'error');
      } else {
        showStatus('Login failed', 'error');
      }
    }
    
    // ============ EVENT LISTENERS ============
    loginForm.addEventListener('submit', handleLogin);
    
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
      togglePasswordBtn.setAttribute('aria-label', 
        type === 'password' ? 'Show password' : 'Hide password'
      );
    });
    
    refreshCaptchaBtn.addEventListener('click', loadCaptcha);
    
    // Clear errors on input
    usernameInput.addEventListener('input', () => clearError('username'));
    passwordInput.addEventListener('input', () => clearError('password'));
    captchaValueInput.addEventListener('input', () => clearError('captchaValue'));
    
    // Auto-submit on Enter in captcha
    captchaValueInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !state.isSubmitting) {
        loginForm.requestSubmit();
      }
    });
    
    // ============ INITIALIZATION ============
    document.addEventListener('DOMContentLoaded', () => {
      loadCaptcha();
      
      // Focus username after a short delay
      setTimeout(() => {
        usernameInput.focus();
      }, 300);
    });
    
    // Handle image load errors
    captchaImage.addEventListener('error', () => {
      captchaImage.style.display = 'none';
      showStatus('Failed to load captcha image', 'error');
    });
    
    captchaImage.addEventListener('load', () => {
      captchaImage.style.display = 'block';
    });
  </script>
</body>
</html>
