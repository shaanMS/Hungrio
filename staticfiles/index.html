<!DOCTYPE html>
<html>
<head>
  <title>Restaurant - Menu</title>
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽</text></svg>">
  
  <style>
    :root {
      --primary-yellow: #FFD166;
      --primary-red: #EF476F;
      --primary-green: #06D6A0;
      --primary-blue: #118AB2;
      --primary-purple: #8338EC;
      --background: #FFFCF9;
      --card-bg: #FFFFFF;
      --text-dark: #073B4C;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      --cartoon-border: 4px solid var(--text-dark);
      --font-cartoon: 'Comic Neue', cursive, sans-serif;
      --vintage-grey: #BFC6C4;
      --vintage-cream: #E8E2D8;
      --vintage-green: #6F8F72;
      --vintage-orange: #F2A65A;
      --vintage-skin: #F5D6BA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-cartoon);
      background: linear-gradient(135deg, #E8E2D8 0%, #BFC6C4 100%);
      background-attachment: fixed;
      color: var(--text-dark);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
    }

    /* Enhanced Vintage Background Pattern */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(111, 143, 114, 0.08) 0%, transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(242, 166, 90, 0.08) 0%, transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(191, 198, 196, 0.1) 0%, transparent 30%),
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(232, 226, 216, 0.1) 2px, rgba(232, 226, 216, 0.1) 4px);
      z-index: -1;
      pointer-events: none;
    }

    /* Vintage paper texture overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.03"/></svg>');
      z-index: -1;
      pointer-events: none;
    }

    /* Enhanced Vintage Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background: linear-gradient(135deg, var(--vintage-cream) 0%, #D4C9B8 100%);
      border-radius: 20px;
      border: var(--cartoon-border);
      margin-bottom: 30px;
      box-shadow: 
        var(--shadow),
        0 0 0 8px var(--vintage-green),
        0 0 0 12px var(--vintage-cream);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      border-image: linear-gradient(45deg, var(--vintage-green), var(--vintage-orange)) 1;
    }

    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        linear-gradient(90deg, transparent 95%, rgba(111, 143, 114, 0.1) 100%),
        linear-gradient(180deg, transparent 95%, rgba(242, 166, 90, 0.1) 100%);
      z-index: 0;
      pointer-events: none;
    }

    header h2 {
      font-size: 2.8rem;
      color: var(--vintage-green);
      text-shadow: 
        2px 2px 0 var(--vintage-cream),
        4px 4px 0 rgba(0, 0, 0, 0.1);
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 15px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 1;
    }

    #user-status {
      background: linear-gradient(135deg, var(--vintage-cream), #D8D1C2);
      padding: 10px 25px;
      border-radius: 50px;
      border: 3px solid var(--vintage-green);
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 
        3px 3px 0 var(--vintage-green),
        inset 2px 2px 0 rgba(255, 255, 255, 0.8);
      transition: all 0.2s;
      min-width: 120px;
      text-align: center;
      backdrop-filter: blur(5px);
      color: var(--vintage-green);
      position: relative;
      overflow: hidden;
    }

    /* Processing Indicator */
    .processing::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .cartoon-btn {
      padding: 12px 28px;
      border: 3px solid var(--vintage-green);
      border-radius: 50px;
      font-family: var(--font-cartoon);
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        3px 3px 0 var(--vintage-green),
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    /* Button Loading State */
    .cartoon-btn.loading {
      pointer-events: none;
      opacity: 0.7;
      padding-right: 45px;
    }

    .cartoon-btn.loading::after {
      content: "";
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: buttonSpin 0.8s linear infinite;
    }

    @keyframes buttonSpin {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(360deg); }
    }

    .cartoon-btn:hover:not(.loading, :disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 
        5px 5px 0 var(--vintage-green),
        inset 0 2px 8px rgba(255, 255, 255, 0.9);
    }

    .cartoon-btn:active:not(.loading, :disabled) {
      transform: translate(1px, 1px);
      box-shadow: 
        2px 2px 0 var(--vintage-green),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    .cartoon-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .logout-btn {
      background: linear-gradient(135deg, var(--vintage-orange), #E6953A);
      color: #FFF;
      border-color: #C97F2A;
    }

    .login-btn {
      background: linear-gradient(135deg, var(--vintage-green), #5A7B5D);
      color: #FFF;
      border-color: #4A6B4D;
    }

    .wishlist-btn-nav {
      background: linear-gradient(135deg, #D4A5A5, #C89595);
      color: #FFF;
      border-color: #A87878;
    }

    .cart-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cart-btn {
      background: linear-gradient(135deg, var(--vintage-green), #5A7B5D);
      color: #FFF;
      border-color: #4A6B4D;
      position: relative;
      padding: 12px 28px 12px 55px;
    }

    #cart-count {
      background: linear-gradient(135deg, var(--vintage-orange), #E6953A);
      color: #FFF;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      position: absolute;
      top: -8px;
      left: -8px;
      border: 3px solid var(--vintage-cream);
      box-shadow: 
        0 0 0 2px var(--vintage-green),
        0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 2;
    }

    .cart-view-link {
      background: linear-gradient(135deg, #A87878, #8F6363);
      color: #FFF;
      border-color: #7A5252;
    }

    hr {
      border: none;
      height: 6px;
      background: repeating-linear-gradient(90deg, 
        var(--vintage-green), 
        var(--vintage-green) 10px, 
        var(--vintage-orange) 10px, 
        var(--vintage-orange) 20px);
      border-radius: 3px;
      margin: 40px 0;
      box-shadow: 
        3px 3px 0 var(--vintage-cream),
        inset 0 1px 2px rgba(255, 255, 255, 0.8);
      opacity: 0.9;
    }

    /* Products Container - Vintage Enhanced */
    #product-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      margin-top: 20px;
      position: relative;
    }

    .product-card {
      background: linear-gradient(145deg, var(--vintage-cream), #E0D9CC);
      border-radius: 20px;
      border: 3px solid var(--vintage-green);
      padding: 25px;
      box-shadow: 
        8px 8px 16px rgba(0, 0, 0, 0.1),
        -8px -8px 16px rgba(255, 255, 255, 0.7),
        inset 2px 2px 4px rgba(255, 255, 255, 0.9),
        inset -2px -2px 4px rgba(0, 0, 0, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .product-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(45deg, transparent 70%, rgba(242, 166, 90, 0.05) 100%),
        linear-gradient(135deg, transparent 70%, rgba(111, 143, 114, 0.05) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .product-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 
        12px 12px 24px rgba(0, 0, 0, 0.15),
        -12px -12px 24px rgba(255, 255, 255, 0.8),
        0 0 0 2px var(--vintage-orange) inset;
    }

    /* Safety Loader Overlay */
    .product-card.loading::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(232, 226, 216, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 20px;
    }

    .product-card.loading::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 4px solid rgba(111, 143, 114, 0.2);
      border-top: 4px solid var(--vintage-green);
      border-radius: 50%;
      animation: cardSpin 1s linear infinite;
      z-index: 11;
    }

    @keyframes cardSpin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
    }

    .product-name {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--vintage-green);
      margin-bottom: 10px;
      line-height: 1.3;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.8);
      letter-spacing: -0.3px;
    }

    .wishlist-btn {
      background: linear-gradient(135deg, var(--vintage-cream), #D8D1C2);
      border: 2px solid var(--vintage-green);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        2px 2px 4px rgba(0, 0, 0, 0.1),
        -2px -2px 4px rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    .wishlist-btn.loading {
      pointer-events: none;
    }

    .wishlist-btn.loading::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(111, 143, 114, 0.2);
      border-top: 3px solid var(--vintage-green);
      border-radius: 50%;
      animation: wishlistSpin 0.8s linear infinite;
    }

    @keyframes wishlistSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .wishlist-btn:hover:not(.loading) {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 
        3px 3px 6px rgba(0, 0, 0, 0.15),
        -3px -3px 6px rgba(255, 255, 255, 0.9);
    }

    .product-category {
      display: inline-block;
      background: linear-gradient(135deg, var(--vintage-skin), #F0C8A8);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 15px;
      border: 2px solid var(--vintage-green);
      box-shadow: 
        2px 2px 0 var(--vintage-green),
        inset 1px 1px 2px rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(5px);
      color: var(--vintage-green);
      font-weight: bold;
      position: relative;
      z-index: 1;
    }

    .product-description {
      color: #5A716A;
      margin-bottom: 20px;
      line-height: 1.6;
      min-height: 60px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      border-left: 4px solid var(--vintage-green);
      box-shadow: 
        inset 2px 2px 4px rgba(0, 0, 0, 0.05),
        inset -2px -2px 4px rgba(255, 255, 255, 0.8);
      position: relative;
      z-index: 1;
    }

    .product-price {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 15px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), rgba(232, 226, 216, 0.7));
      border-radius: 15px;
      border: 2px solid var(--vintage-green);
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.8),
        inset -2px -2px 4px rgba(0, 0, 0, 0.05);
      position: relative;
      z-index: 1;
    }

    .final-price {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--vintage-orange);
      text-shadow: 
        2px 2px 0 rgba(255, 255, 255, 0.8),
        0 0 10px rgba(242, 166, 90, 0.2);
      letter-spacing: -0.5px;
    }

    .original-price {
      font-size: 1.3rem;
      color: #8A9B94;
      text-decoration: line-through;
      margin-right: 10px;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.8);
    }

    .veg-indicator {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--vintage-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 
        2px 2px 4px rgba(0, 0, 0, 0.1),
        -2px -2px 4px rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    .veg {
      background: linear-gradient(135deg, var(--vintage-green), #5A7B5D);
      color: #FFF;
    }

    .non-veg {
      background: linear-gradient(135deg, #D4A5A5, #C89595);
      color: #FFF;
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--vintage-green), #5A7B5D);
      color: #FFF;
      border: 3px solid #4A6B4D;
      border-radius: 50px;
      font-family: var(--font-cartoon);
      font-weight: bold;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 
        4px 4px 0 #4A6B4D,
        inset 0 2px 8px rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .add-to-cart-btn.loading {
      pointer-events: none;
      padding-right: 60px;
    }

    .add-to-cart-btn.loading::after {
      content: "";
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: cartSpin 0.8s linear infinite;
    }

    @keyframes cartSpin {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(360deg); }
    }

    .add-to-cart-btn:hover:not(.loading, :disabled) {
      background: linear-gradient(135deg, #5A7B5D, var(--vintage-green));
      transform: translate(-3px, -3px);
      box-shadow: 
        6px 6px 0 #4A6B4D,
        inset 0 4px 12px rgba(255, 255, 255, 0.4);
    }

    .add-to-cart-btn:active:not(.loading, :disabled) {
      transform: translate(1px, 1px);
      box-shadow: 
        2px 2px 0 #4A6B4D,
        inset 0 1px 4px rgba(255, 255, 255, 0.2);
    }

    .add-to-cart-btn:disabled {
      background: linear-gradient(135deg, #BFC6C4, #A8B0AE);
      border-color: #8A9B94;
      cursor: not-allowed;
      transform: none !important;
    }

    .add-to-cart-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .add-to-cart-btn:hover::before {
      left: 100%;
    }

    .discount-badge {
      position: absolute;
      top: 20px;
      right: -35px;
      background: linear-gradient(135deg, var(--vintage-orange), #E6953A);
      color: #FFF;
      padding: 10px 40px;
      transform: rotate(45deg);
      font-weight: bold;
      font-size: 0.9rem;
      border: 2px solid var(--vintage-cream);
      box-shadow: 
        0 0 0 3px var(--vintage-green),
        0 6px 12px rgba(0, 0, 0, 0.2);
      z-index: 2;
      letter-spacing: 1px;
    }

    .notification {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(135deg, var(--vintage-green), #5A7B5D);
      color: #FFF;
      padding: 20px 30px;
      border-radius: 15px;
      border: 3px solid #4A6B4D;
      box-shadow: 
        8px 8px 16px rgba(0, 0, 0, 0.2),
        inset 2px 2px 4px rgba(255, 255, 255, 0.3);
      display: none;
      z-index: 1000;
      font-weight: bold;
      font-size: 1.1rem;
      animation: vintageBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      max-width: 350px;
      backdrop-filter: blur(10px);
      border-left: 8px solid var(--vintage-orange);
    }

    @keyframes vintageBounce {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }

    .notification.error {
      background: linear-gradient(135deg, #D4A5A5, #C89595);
      border-color: #A87878;
      border-left-color: var(--vintage-orange);
    }

    .notification.success {
      background: linear-gradient(135deg, var(--vintage-green), #5A7B5D);
      border-color: #4A6B4D;
      border-left-color: var(--vintage-orange);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 40px;
      padding: 20px;
      background: linear-gradient(135deg, var(--vintage-cream), #D8D1C2);
      border-radius: 20px;
      border: 3px solid var(--vintage-green);
      box-shadow: 
        4px 4px 12px rgba(0, 0, 0, 0.1),
        -4px -4px 12px rgba(255, 255, 255, 0.8);
    }

    .page-btn {
      padding: 12px 28px;
      border: 3px solid var(--vintage-green);
      border-radius: 50px;
      background: linear-gradient(135deg, var(--vintage-cream), #D8D1C2);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-family: var(--font-cartoon);
      backdrop-filter: blur(5px);
      box-shadow: 
        3px 3px 6px rgba(0, 0, 0, 0.1),
        -3px -3px 6px rgba(255, 255, 255, 0.8),
        inset 2px 2px 4px rgba(255, 255, 255, 0.9);
      color: var(--vintage-green);
    }

    .page-btn.loading {
      pointer-events: none;
      opacity: 0.7;
      padding-right: 45px;
    }

    .page-btn.loading::after {
      content: "";
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border: 3px solid rgba(111, 143, 114, 0.2);
      border-top: 3px solid var(--vintage-green);
      border-radius: 50%;
      animation: pageSpin 0.8s linear infinite;
    }

    @keyframes pageSpin {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(360deg); }
    }

    .page-btn:hover:not(:disabled, .loading) {
      background: linear-gradient(135deg, var(--vintage-green), #5A7B5D);
      color: #FFF;
      transform: translate(-2px, -2px);
      box-shadow: 
        5px 5px 10px rgba(0, 0, 0, 0.15),
        -5px -5px 10px rgba(255, 255, 255, 0.9);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .current-page {
      font-weight: bold;
      font-size: 1.3rem;
      padding: 10px 25px;
      background: linear-gradient(135deg, var(--vintage-cream), #D8D1C2);
      border-radius: 50px;
      border: 3px solid var(--vintage-green);
      box-shadow: 
        inset 2px 2px 4px rgba(255, 255, 255, 0.9),
        inset -2px -2px 4px rgba(0, 0, 0, 0.05);
      color: var(--vintage-green);
      min-width: 120px;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    /* Loading State */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(145deg, var(--vintage-cream), #D8D1C2);
      border-radius: 20px;
      border: 3px solid var(--vintage-green);
      box-shadow: 
        8px 8px 16px rgba(0, 0, 0, 0.1),
        -8px -8px 16px rgba(255, 255, 255, 0.7);
    }

    .spinner {
      display: inline-block;
      width: 60px;
      height: 60px;
      border: 5px solid rgba(111, 143, 114, 0.2);
      border-top: 5px solid var(--vintage-green);
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      margin-bottom: 25px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(145deg, var(--vintage-cream), #D8D1C2);
      border-radius: 20px;
      border: 3px dashed var(--vintage-green);
      box-shadow: 
        8px 8px 16px rgba(0, 0, 0, 0.1),
        -8px -8px 16px rgba(255, 255, 255, 0.7);
    }

    .empty-icon {
      font-size: 4.5rem;
      margin-bottom: 25px;
      color: var(--vintage-green);
      text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
    }

    /* Click Debounce Indicator */
    .debounce-active {
      pointer-events: none;
      opacity: 0.7;
    }

    /* Safety Overlay */
    .safety-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(232, 226, 216, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(5px);
    }

    .safety-loader {
      width: 80px;
      height: 80px;
      border: 6px solid rgba(111, 143, 114, 0.2);
      border-top: 6px solid var(--vintage-green);
      border-radius: 50%;
      animation: safetySpin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    @keyframes safetySpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(720deg); }
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 20px;
        padding: 20px;
      }
      
      .header-controls {
        flex-wrap: wrap;
        justify-content: center;
      }
      
      #product-list {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }
      
      .cartoon-btn {
        padding: 10px 20px;
        font-size: 1rem;
      }
      
      .pagination {
        flex-direction: column;
        gap: 15px;
      }
    }

    @media (max-width: 480px) {
      header h2 {
        font-size: 2.2rem;
      }
      
      #product-list {
        grid-template-columns: 1fr;
      }
      
      .cartoon-btn {
        padding: 10px 15px;
        font-size: 0.9rem;
      }
      
      .cart-section {
        flex-direction: column;
        width: 100%;
      }
      
      body {
        padding: 10px;
      }
      
      .product-card {
        padding: 20px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Safety Overlay for Critical Operations -->
<div id="safety-overlay" class="safety-overlay">
  <div class="safety-loader"></div>
</div>

<header>
  <h2>🍽 Restaurant</h2>

  <div class="header-controls">
    <span id="user-status">Guest</span>
    
    <!-- Logout Button - Only shown when user is logged in -->
    <button onclick="logout()" class="cartoon-btn logout-btn">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
    
    <!-- Login Button - Only shown when user is logged out -->
    <a href="/login" class="cartoon-btn login-btn">
      <i class="fas fa-sign-in-alt"></i> Login
    </a>
    
    <!-- Wishlist Button -->
    <a href="/wishlist/" class="cartoon-btn wishlist-btn-nav">
      <i class="fas fa-heart"></i> Wishlist
    </a>
    
    <div class="cart-section">
      <button class="cartoon-btn cart-btn" id="cart-toggle-btn">
        <i class="fas fa-shopping-cart"></i> Cart 
        <span id="cart-count">0</span>
      </button>
      
      <a href="/cart/" class="cartoon-btn cart-view-link">
        <i class="fas fa-external-link-alt"></i> View Cart
      </a>
    </div>
  </div>
</header>

<hr>

<div id="product-list">
  <div class="loading">
    <div class="spinner"></div>
    <p>Loading delicious dishes...</p>
  </div>
</div>

<div id="pagination" class="pagination" style="display: none;">
  <button id="prev-btn" class="page-btn" onclick="loadPreviousPage()">
    <i class="fas fa-chevron-left"></i> Previous
  </button>
  <span id="current-page" class="current-page">Page 1</span>
  <button id="next-btn" class="page-btn" onclick="loadNextPage()">
    Next <i class="fas fa-chevron-right"></i>
  </button>
</div>

<div id="notification" class="notification"></div>

<script>
  // API Configuration
  const API_BASE = 'https://hungrio-production.up.railway.app';
  
  // Global variables
  let currentPage = 1;
  let nextPageUrl = null;
  let previousPageUrl = null;
  let userWishlist = new Set(); // Store wishlisted product IDs
  let isLoggedIn = false;
  
  // Safety variables
  let isProcessing = false;
  let lastActionTime = 0;
  const ACTION_DEBOUNCE = 1000; // 1 second debounce
  let activeOperations = new Set(); // Track ongoing operations

  // DOM Elements
  const userStatus = document.getElementById('user-status');
  const logoutBtn = document.querySelector('.logout-btn');
  const loginBtn = document.querySelector('.login-btn');
  const productList = document.getElementById('product-list');
  const pagination = document.getElementById('pagination');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const currentPageSpan = document.getElementById('current-page');
  const safetyOverlay = document.getElementById('safety-overlay');
  const cartToggleBtn = document.getElementById('cart-toggle-btn');

  // Safety check helper
  function safetyCheck(operationId) {
    if (isProcessing) {
      showNotification('Please wait for previous action to complete', 'error');
      return false;
    }
    
    const now = Date.now();
    if (now - lastActionTime < ACTION_DEBOUNCE) {
      showNotification('Please wait a moment before trying again', 'error');
      return false;
    }
    
    if (activeOperations.has(operationId)) {
      showNotification('Operation already in progress', 'error');
      return false;
    }
    
    lastActionTime = now;
    activeOperations.add(operationId);
    return true;
  }

  // Complete operation helper
  function completeOperation(operationId) {
    isProcessing = false;
    activeOperations.delete(operationId);
  }

  // Show safety overlay for critical operations
  function showSafetyOverlay(show) {
    if (show) {
      safetyOverlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    } else {
      safetyOverlay.style.display = 'none';
      document.body.style.overflow = '';
    }
  }

  // API Fetch helper with safety timeout
  function apiFetch(url, options = {}) {
    const token = localStorage.getItem("access");
    const headers = options.headers || {};
    
    if (token) {
      headers["Authorization"] = "Bearer " + token;
    }
    
    // Add CSRF token for Django
    const csrfToken = getCookie('csrftoken');
    if (csrfToken && (options.method === 'POST' || options.method === 'PUT' || options.method === 'DELETE')) {
      headers["X-CSRFToken"] = csrfToken;
    }

    // Add timeout to prevent hanging requests
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 second timeout

    return fetch(url, {
      ...options,
      headers,
      credentials: 'include',
      signal: controller.signal
    }).finally(() => clearTimeout(timeoutId));
  }

  // Helper to get CSRF token
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', initialize);

  async function initialize() {
    try {
      await checkAuthStatus();
      if (isLoggedIn) {
        await loadUserWishlist();
      }
      await loadProducts();
      await loadCart();
    } catch (error) {
      console.error('Initialization error:', error);
      showNotification('Failed to initialize. Please refresh the page.', 'error');
    }
  }

  // Check authentication status
  async function checkAuthStatus() {
    const operationId = 'auth-check-' + Date.now();
    if (!safetyCheck(operationId)) return;
    
    try {
      isProcessing = true;
      userStatus.classList.add('processing');
      
      const res = await apiFetch(`${API_BASE}/account/api/auth/me/`);
      if (res.ok) {
        const data = await res.json();
        userStatus.textContent = data.username || 'User';
        userStatus.style.backgroundColor = '#FFD166';
        logoutBtn.style.display = 'flex';
        loginBtn.style.display = 'none';
        isLoggedIn = true;
      } else {
        throw new Error('Not authenticated');
      }
    } catch (error) {
      userStatus.textContent = 'Guest';
      userStatus.style.backgroundColor = '#FFFFFF';
      logoutBtn.style.display = 'none';
      loginBtn.style.display = 'flex';
      isLoggedIn = false;
    } finally {
      userStatus.classList.remove('processing');
      completeOperation(operationId);
    }
  }

  // Load user's wishlist
  async function loadUserWishlist() {
    if (!isLoggedIn) return;
    
    const operationId = 'wishlist-load-' + Date.now();
    if (!safetyCheck(operationId)) return;
    
    try {
      isProcessing = true;
      const res = await apiFetch(`${API_BASE}/api/wishlist/`);
      if (res.ok) {
        const data = await res.json();
        // Clear existing wishlist
        userWishlist.clear();
        // Add product IDs to wishlist set
        if (data.data && Array.isArray(data.data)) {
          data.data.forEach(item => {
            if (item.product && item.product.id) {
              userWishlist.add(item.product.id);
            }
          });
        }
      }
    } catch (error) {
      console.error('Error loading wishlist:', error);
      showNotification('Failed to load wishlist', 'error');
    } finally {
      completeOperation(operationId);
    }
  }

  // Toggle wishlist status with safety indicators
  async function toggleWishlist(productId) {
    if (!isLoggedIn) {
      showNotification('Please login to add items to wishlist', 'error');
      return;
    }

    const operationId = 'wishlist-toggle-' + productId;
    if (!safetyCheck(operationId)) return;

    const wishlistBtn = document.querySelector(`.wishlist-btn[onclick="toggleWishlist(${productId})"]`);
    const isWishlisted = userWishlist.has(productId);

    // Show loading state
    wishlistBtn.classList.add('loading');
    wishlistBtn.disabled = true;

    try {
      isProcessing = true;
      
      if (isWishlisted) {
        // Remove from wishlist
        const res = await apiFetch(`${API_BASE}/api/wishlist/`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ product: productId })
        });

        if (res.ok) {
          userWishlist.delete(productId);
          wishlistBtn.innerHTML = '🤍';
          wishlistBtn.title = 'Add to wishlist';
          showNotification('Removed from wishlist', 'success');
        } else {
          throw new Error('Failed to remove from wishlist');
        }
      } else {
        // Add to wishlist
        const res = await apiFetch(`${API_BASE}/api/wishlist/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ product: productId })
        });

        if (res.ok) {
          userWishlist.add(productId);
          wishlistBtn.innerHTML = '❤️';
          wishlistBtn.title = 'Remove from wishlist';
          showNotification('Added to wishlist!', 'success');
        } else {
          throw new Error('Failed to add to wishlist');
        }
      }
    } catch (error) {
      console.error('Wishlist error:', error);
      showNotification('Failed to update wishlist', 'error');
    } finally {
      // Reset button state
      setTimeout(() => {
        wishlistBtn.classList.remove('loading');
        wishlistBtn.disabled = false;
        completeOperation(operationId);
      }, 300);
    }
  }

  // Add to cart with safety indicators
  async function addToCart(productId) {
    if (!isLoggedIn) {
      showNotification('Please login to add items to cart', 'error');
      return;
    }

    const operationId = 'cart-add-' + productId;
    if (!safetyCheck(operationId)) return;

    const addBtn = document.querySelector(`.add-to-cart-btn[onclick="addToCart(${productId})"]`);
    
    // Show loading state
    addBtn.classList.add('loading');
    addBtn.disabled = true;
    addBtn.textContent = 'Adding...';

    try {
      isProcessing = true;
      showSafetyOverlay(true);
      
      const res = await apiFetch(`${API_BASE}/api/cart/add/`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          product: productId,
          quantity: 1
        })
      });

      if (res.ok) {
        const data = await res.json();
        await loadCart();
        showNotification('Added to cart! 🛒', 'success');
      } else {
        throw new Error('Failed to add to cart');
      }
    } catch (error) {
      console.error('Cart error:', error);
      showNotification('Failed to add item to cart', 'error');
    } finally {
      // Reset button state with smooth transition
      setTimeout(() => {
        addBtn.classList.remove('loading');
        addBtn.disabled = false;
        addBtn.textContent = 'Add to Cart';
        showSafetyOverlay(false);
        completeOperation(operationId);
      }, 500);
    }
  }

  // Load cart with safety
  async function loadCart() {
    const operationId = 'cart-load-' + Date.now();
    
    try {
      const cartCount = document.getElementById('cart-count');
      cartToggleBtn.classList.add('loading');
      
      const res = await apiFetch(`${API_BASE}/api/cart/`);
      if (res.ok) {
        const data = await res.json();
        if (data.items && Array.isArray(data.items)) {
          const totalItems = data.items.reduce((sum, item) => sum + item.quantity, 0);
          cartCount.textContent = totalItems;
          
          // Animate cart count update
          cartCount.style.transform = 'scale(1.2)';
          setTimeout(() => {
            cartCount.style.transform = 'scale(1)';
          }, 300);
        }
      }
    } catch (error) {
      console.error('Cart load error:', error);
    } finally {
      cartToggleBtn.classList.remove('loading');
      completeOperation(operationId);
    }
  }

  // Load products with pagination safety
  async function loadProducts(url = `${API_BASE}/api/products/?page=${currentPage}`) {
    const operationId = 'products-load-' + currentPage;
    if (!safetyCheck(operationId)) return;
    
    try {
      isProcessing = true;
      showSafetyOverlay(true);
      
      // Show loading state in product list
      productList.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading delicious dishes...</p>
        </div>
      `;
      
      // Disable pagination during load
      if (prevBtn) prevBtn.disabled = true;
      if (nextBtn) nextBtn.disabled = true;
      
      const res = await apiFetch(url);
      if (!res.ok) throw new Error('Failed to load products');
      
      const data = await res.json();
      
      // Update pagination state
      nextPageUrl = data.next;
      previousPageUrl = data.previous;
      
      // Render products
      renderProducts(data.results || data.data || []);
      
      // Update pagination UI
      if (data.results && data.results.length > 0) {
        pagination.style.display = 'flex';
        currentPageSpan.textContent = `Page ${currentPage}`;
        
        prevBtn.disabled = !previousPageUrl;
        nextBtn.disabled = !nextPageUrl;
        
        // Add loading state to pagination buttons
        prevBtn.classList.remove('loading');
        nextBtn.classList.remove('loading');
      } else {
        pagination.style.display = 'none';
        productList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🍽</div>
            <h3>No dishes available</h3>
            <p>Check back later for new menu items!</p>
          </div>
        `;
      }
    } catch (error) {
      console.error('Products load error:', error);
      productList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <h3>Failed to load menu</h3>
          <p>Please try refreshing the page</p>
          <button onclick="loadProducts()" class="cartoon-btn" style="margin-top: 20px;">
            <i class="fas fa-redo"></i> Retry
          </button>
        </div>
      `;
      showNotification('Failed to load products', 'error');
    } finally {
      showSafetyOverlay(false);
      completeOperation(operationId);
      
      // Re-enable pagination buttons
      if (prevBtn) prevBtn.disabled = !previousPageUrl;
      if (nextBtn) nextBtn.disabled = !nextPageUrl;
    }
  }

  // Load next page with safety
  async function loadNextPage() {
    if (!nextPageUrl || isProcessing) return;
    
    const operationId = 'page-next-' + currentPage;
    if (!safetyCheck(operationId)) return;
    
    nextBtn.classList.add('loading');
    prevBtn.disabled = true;
    
    try {
      currentPage++;
      await loadProducts(nextPageUrl);
    } catch (error) {
      console.error('Next page error:', error);
      currentPage--;
      showNotification('Failed to load next page', 'error');
    } finally {
      nextBtn.classList.remove('loading');
      completeOperation(operationId);
    }
  }

  // Load previous page with safety
  async function loadPreviousPage() {
    if (!previousPageUrl || isProcessing) return;
    
    const operationId = 'page-prev-' + currentPage;
    if (!safetyCheck(operationId)) return;
    
    prevBtn.classList.add('loading');
    nextBtn.disabled = true;
    
    try {
      currentPage--;
      await loadProducts(previousPageUrl);
    } catch (error) {
      console.error('Previous page error:', error);
      currentPage++;
      showNotification('Failed to load previous page', 'error');
    } finally {
      prevBtn.classList.remove('loading');
      completeOperation(operationId);
    }
  }

  // Render products with wishlist status
  function renderProducts(products) {
    if (!products.length) {
      productList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🍽</div>
          <h3>No dishes available</h3>
          <p>Check back later for new menu items!</p>
        </div>
      `;
      return;
    }

    productList.innerHTML = products.map(product => {
      const isWishlisted = userWishlist.has(product.id);
      const originalPrice = product.original_price || product.price * 1.2;
      const discount = Math.round((1 - product.price / originalPrice) * 100);
      const isVeg = product.category && product.category.toLowerCase().includes('veg');

      return `
        <div class="product-card" data-id="${product.id}">
          ${discount > 0 ? `<div class="discount-badge">${discount}% OFF</div>` : ''}
          
          <div class="product-header">
            <h3 class="product-name">${product.name}</h3>
            <button class="wishlist-btn ${isWishlisted ? 'wishlisted' : ''}" 
                    onclick="toggleWishlist(${product.id})"
                    title="${isWishlisted ? 'Remove from wishlist' : 'Add to wishlist'}">
              ${isWishlisted ? '❤️' : '🤍'}
            </button>
          </div>
          
          <span class="product-category">${product.category || 'Main Course'}</span>
          
          <p class="product-description">${product.description || 'Delicious dish prepared with care.'}</p>
          
          <div class="product-price">
            <div>
              <span class="original-price">$${originalPrice.toFixed(2)}</span>
              <span class="final-price">$${product.price.toFixed(2)}</span>
            </div>
            <div class="veg-indicator ${isVeg ? 'veg' : 'non-veg'}">
              ${isVeg ? '🌿' : '🥩'}
            </div>
          </div>
          
          <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
            <i class="fas fa-cart-plus"></i> Add to Cart
          </button>
        </div>
      `;
    }).join('');
  }

  // Show notification
  function showNotification(message, type = 'success') {
    const notification = document.getElementById('notification');
    notification.textContent = message;
    notification.className = `notification ${type}`;
    notification.style.display = 'block';
    
    // Auto-hide after 3 seconds
    setTimeout(() => {
      notification.style.display = 'none';
    }, 3000);
  }

  // Logout function
  async function logout() {
    const operationId = 'logout-' + Date.now();
    if (!safetyCheck(operationId)) return;
    
    try {
      isProcessing = true;
      showSafetyOverlay(true);
      
      await apiFetch(`${API_BASE}/account/api/auth/logout/`, {
        method: 'POST'
      });
      
      localStorage.removeItem("access");
      localStorage.removeItem("refresh");
      window.location.href = '/login';
    } catch (error) {
      console.error('Logout error:', error);
      showNotification('Logout failed', 'error');
    } finally {
      showSafetyOverlay(false);
      completeOperation(operationId);
    }
  }
</script>
</body>
</html>
